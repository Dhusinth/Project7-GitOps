apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: karpenter
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Dhusinth/Project7-GitOps.git
    targetRevision: HEAD
    path: karpenter

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true