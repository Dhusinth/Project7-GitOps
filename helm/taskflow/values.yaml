# Default values for the TaskFlow chart.
# Override per-environment with -f values-staging.yaml / -f values-prod.yaml,
# or via ArgoCD Application `helm.valueFiles` / `helm.parameters`.

global:
  namespace: taskflow

backend:
  # Fallback default only — dev/prod always override this (see
  # values-dev.yaml / values-prod.yaml). Not the file a CI pipeline should
  # be editing; useful mainly for `helm template` with no -f flags at all.
  image:
    repository: dhusinth123/taskflow-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  replicaCount: 2

  # Always deployed as an Argo Rollout (Argo Rollouts is installed
  # cluster-wide, so there's no plain-Deployment fallback).
  rolloutStrategy: canary   # canary | blueGreen

  service:
    port: 8000
    targetPort: 8000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75

  env:
    APP_ENV: production
    LOG_LEVEL: INFO
    # Frontend and backend share one ALB/host (see ingress.yaml — same
    # origin, different paths), so browser requests through the ALB never
    # trigger CORS. This only matters if something hits the API from a
    # different origin (e.g. local frontend dev server) — see
    # values-dev.yaml for that case.
    CORS_ORIGINS: ""

  probes:
    liveness:
      path: /live
      initialDelaySeconds: 5
      periodSeconds: 10
    readiness:
      path: /ready
      initialDelaySeconds: 5
      periodSeconds: 10

frontend:
  # Fallback default only — see the same note on backend.image above.
  image:
    repository: dhusinth123/taskflow-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  replicaCount: 2

  rolloutStrategy: canary   # canary | blueGreen

  service:
    port: 80
    targetPort: 8080

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

postgres:
  # Set to false and point backend.env.DATABASE_URL at a managed instance
  # (RDS/Cloud SQL/etc.) for real environments. Enabled here to demonstrate
  # a stateful workload running in-cluster.
  enabled: true
  image: postgres:16-alpine
  storage:
    size: 5Gi
    storageClassName: ""   # "" = cluster default StorageClass
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  auth:
    database: taskflow
    username: taskflow
    # password is provided via Secret — see templates/secret.yaml / --set-file

redis:
  enabled: true
  image: redis:7-alpine
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

ingress:
  enabled: true
  className: alb
  # Left blank on purpose — no owned domain for this demo project. With no
  # host set, the Ingress rule matches any Host header, so you can hit the
  # ALB's own AWS-generated DNS name directly (find it with
  # `kubectl get ingress -n taskflow`). Set a real value here (and point
  # DNS at the ALB) once/if this ever sits behind an owned domain.
  host: ""
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health

migrationJob:
  enabled: true
  seedDemoData: true

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s

secrets:
  # Overridden via --set or a sealed-secrets/external-secrets integration
  # in real GitOps flows. Never commit real values here.
  secretKey: "change-me-in-production"
  postgresPassword: "change-me-in-production"
