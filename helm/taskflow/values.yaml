# Default values for the TaskFlow chart.
# Override per-environment with -f values-dev.yaml / -f values-prod.yaml,
# or via the ArgoCD ApplicationSet's `helm.valueFiles`.

global:
  namespace: taskflow

backend:
  # Fallback default only — dev/prod always override this (see
  # values-dev.yaml / values-prod.yaml). Not the file a CI pipeline should
  # be editing; useful mainly for `helm template` with no -f flags at all.
  image:
    repository: dhusinth123/taskflow-backend
    tag: "8167751"
    pullPolicy: IfNotPresent
  replicaCount: 2

  service:
    port: 8000
    targetPort: 8000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75

  env:
    APP_ENV: production
    LOG_LEVEL: INFO
    # Frontend and backend share one ALB/host (see ingress.yaml — same
    # origin, different paths), so browser requests through the ALB never
    # trigger CORS. This only matters if something hits the API from a
    # different origin (e.g. local frontend dev server) — see
    # values-dev.yaml for that case.
    CORS_ORIGINS: ""

  probes:
    liveness:
      path: /live
      initialDelaySeconds: 5
      periodSeconds: 10
    readiness:
      path: /ready
      initialDelaySeconds: 5
      periodSeconds: 10

frontend:
  # Fallback default only — see the same note on backend.image above.
  image:
    repository: dhusinth123/taskflow-frontend
    tag: "8167751"
    pullPolicy: IfNotPresent
  replicaCount: 2

  service:
    port: 80
    targetPort: 8080

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: alb
  # Left blank on purpose — no owned domain for this demo project. With no
  # host set, the Ingress rule matches any Host header, so you can hit the
  # ALB's own AWS-generated DNS name directly (find it with
  # `kubectl get ingress -n taskflow`). Set a real value here (and point
  # DNS at the ALB) once/if this ever sits behind an owned domain.
  host: ""
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # /healthz is the frontend's own nginx endpoint (see
    # frontend/nginx.conf.template in the app repo) — the ALB only ever
    # targets the frontend Service, so this must be a path nginx serves,
    # not the backend's /health.
    alb.ingress.kubernetes.io/healthcheck-path: /healthz

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s

secrets:
  # Overridden via --set or a sealed-secrets/external-secrets integration
  # in real GitOps flows. Never commit real values here.
  secretKey: "change-me-in-production"
