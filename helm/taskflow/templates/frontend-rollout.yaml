# Requires the Argo Rollouts controller (argoproj.io/v1alpha1) installed
# in-cluster. Pick the strategy with `frontend.rolloutStrategy: canary|blueGreen`.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: taskflow-frontend
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    {{- include "taskflow.frontend.selectorLabels" . | nindent 4 }}
    {{- include "taskflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "taskflow.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "taskflow.frontend.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        {{- include "taskflow.frontend.container" . | nindent 8 }}
  strategy:
    {{- if eq .Values.frontend.rolloutStrategy "blueGreen" }}
    blueGreen:
      activeService: taskflow-frontend
      previewService: taskflow-frontend-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
    {{- else }}
    canary:
      canaryService: taskflow-frontend-canary
      stableService: taskflow-frontend
      steps:
        - setWeight: 10
        - pause: { duration: 60 }
        - setWeight: 50
        - pause: { duration: 60 }
        - setWeight: 100
      trafficRouting:
        alb:
          ingress: taskflow-frontend-ingress
          servicePort: {{ .Values.frontend.service.port }}
    {{- end }}
