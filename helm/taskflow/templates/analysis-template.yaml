# Shared canary success-rate check, used by backend-rollout.yaml (and
# frontend-rollout.yaml if it's later switched to a canary strategy).
# Requires the kube-prometheus-stack ServiceMonitor scraping the target
# service, and the Argo Rollouts Prometheus metric provider talking to it.
{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: taskflow-success-rate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      interval: 30s
      count: 5
      successCondition: result[0] >= 0.95
      failureLimit: 2
      provider:
        prometheus:
          address: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          query: >-
            sum(rate(http_requests_total{service="{{`{{args.service-name}}`}}",code!~"5.."}[2m]))
            /
            sum(rate(http_requests_total{service="{{`{{args.service-name}}`}}"}[2m]))
{{- end }}
