apiVersion: v1
kind: Service
metadata:
  name: taskflow-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taskflow.backend.selectorLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "taskflow.backend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
