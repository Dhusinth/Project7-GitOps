# In a real GitOps setup, this Secret would be managed by Sealed Secrets,
# External Secrets Operator, or SOPS — not committed to git in plaintext.
# It's included here as a plain Secret so the chart is runnable standalone.
apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
