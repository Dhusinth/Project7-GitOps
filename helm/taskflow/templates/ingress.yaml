# Uses the AWS Load Balancer Controller (installed via Terraform, not this
# repo). Only the frontend is exposed through the ALB: the frontend's own
# nginx (see frontend/nginx.conf.template in the app repo) reverse-proxies
# `/api/*` to the backend Service in-cluster (taskflow-backend:<port>),
# stripping the `/api` prefix before forwarding — FastAPI's own routes are
# unprefixed (`/login`, `/tasks`, `/me`, ...). Routing `/api/*` at the ALB
# straight to the backend Service would send FastAPI a path it doesn't
# serve, so the backend is deliberately NOT exposed via its own Ingress.
# HTTP only — no ACM cert / TLS for this demo project (see values.yaml
# ingress.annotations for the HTTP-only listener).
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskflow-frontend-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taskflow.frontend.selectorLabels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    argocd.argoproj.io/sync-wave: "50"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taskflow-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
