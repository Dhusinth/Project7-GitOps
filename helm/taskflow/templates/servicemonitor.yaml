{{- if .Values.monitoring.serviceMonitor.enabled }}
# Requires the Prometheus Operator CRDs in-cluster (kube-prometheus-stack,
# installed by applications/monitoring.yaml with Helm releaseName
# "monitoring"). kube-prometheus-stack's Prometheus only picks up
# ServiceMonitors labeled `release: <its own Helm release name>` by
# default (serviceMonitorSelectorNilUsesHelmValues), so this label must
# match that release name — not a hardcoded "prometheus".
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: taskflow-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taskflow.backend.selectorLabels" . | nindent 4 }}
    release: monitoring
spec:
  selector:
    matchLabels:
      {{- include "taskflow.backend.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
