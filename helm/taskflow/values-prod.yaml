# Prod environment overrides. Merged on top of values.yaml by ArgoCD
# (applications/taskflow-applicationset.yaml -> helm.valueFiles).
# Goal: more replicas, tighter resource floor. HTTP only (no TLS/ACM) —
# this is a demo project without an owned domain.
# NOTE: secrets.secretKey is intentionally left at the values.yaml
# placeholder here — in a real environment it must be supplied out-of-band
# (sealed-secrets / External Secrets Operator / SOPS), never committed in
# plaintext, even in an override file.

backend:
  # Updated manually (or by a promotion job) once a tag has been verified
  # in dev — this is the deliberate gate between "deployed to dev" and
  # "deployed to prod" that the Jenkinsfile alone doesn't cross.
  image:
    repository: dhusinth123/taskflow-backend
    tag: "6fd2d88"
  replicaCount: 2
  env:
    APP_ENV: production
    LOG_LEVEL: INFO
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4

frontend:
  image:
    repository: dhusinth123/taskflow-frontend
    tag: "6fd2d88"
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
