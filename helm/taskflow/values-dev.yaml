# Dev environment overrides. Merged on top of values.yaml by ArgoCD
# (applications/taskflow-applicationset.yaml -> helm.valueFiles).
# Goal: cheap, fast-moving, auto-synced, no TLS. Plain Deployments — every
# push here rolls out immediately, no canary/pause steps.

backend:
  # Jenkinsfile updates this tag on every dev deploy (e.g. yq/sed replacing
  # the value, then committing + pushing — ArgoCD auto-syncs dev from there).
  # repository is repeated here (not just tag) so this file is a complete,
  # self-contained record of what's actually running in dev.
  image:
    repository: dhusinth123/taskflow-backend
    tag: "2118772"

  replicaCount: 1
  autoscaling:
    enabled: false
  env:
    APP_ENV: development
    LOG_LEVEL: DEBUG
    CORS_ORIGINS: "http://localhost:5173"

frontend:
  image:
    repository: dhusinth123/taskflow-frontend
    tag: "2118772"
  replicaCount: 1
  autoscaling:
    enabled: false

ingress:
  # No host — see values.yaml for why. Hit the ALB's own DNS name directly.
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz

monitoring:
  serviceMonitor:
    enabled: false

secrets:
  secretKey: "dev-only-not-secret"
